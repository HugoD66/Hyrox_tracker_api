services:
  postgres:
    image: postgres:15-alpine
    container_name: hyrox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hyrox_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hyrox-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: hyrox-db-init
    restart: 'no'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hyrox_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hyrox-network
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "
        npm run prisma:generate &&
        npx prisma migrate deploy &&
        npm run prisma:seed
      "

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: hyrox-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hyrox_db
      JWT_SECRET: dev-secret-key
      JWT_EXPIRATION: 7d
      CORS_ORIGIN: http://localhost:4200,http://127.0.0.1:4200
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - hyrox-network
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm run prisma:generate && npm run start:dev"

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: hyrox-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - '9090:9090'
    networks:
      - hyrox-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: hyrox-grafana
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - hyrox-network

volumes:
  postgres_data:
    driver: local

networks:
  hyrox-network:
    driver: bridge
